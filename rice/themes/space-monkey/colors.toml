# Space Monkey (https://github.com/TyRichards/omarchy-space-monkey-theme, 814af89, GPL-3.0):
# golden text and rust accents on deep brown, a warm mid-century-modern space theme and
# an Omarchy 4 palette. Upstream's file as is, then the rice pins at the end.

mode = "dark"

accent = "#bd4924"
selection = "#f4cc5d"
selection_foreground = "#1c0e00"
muted = "#948a8b"

background = "#1c0e00"
