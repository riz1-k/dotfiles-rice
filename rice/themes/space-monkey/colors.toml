# Warm stone borders stay independent from Space Monkey's rust accent.
# rice: Hyprland-only, and in Hyprland's rgba(rrggbbaa) form, which rice reads as
# not a colour (a warning on every switch).
# hyprland_active_border = "rgba(a89984de)"
# hyprland_inactive_border = "rgba(a8998480)"

# rice: rows and hovers (btop, lazygit, yazi, vicinae...) use selection, which here is
# the strong gold (Omarchy 4's meaning): gold text on it is 1.3:1. Upstream's own raised
# surface instead (its launcher input and controls), and the gold kept for selected text.
selection = "#291603"
selection_background = "#f4cc5d"
