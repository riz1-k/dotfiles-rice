# Firesky (https://github.com/bjarneo/omarchy-firesky-theme, eda1a28, no licence): warm
# parchment text, ember reds and oranges and deep teals on near-black, "a silhouetted
# landscape against a fire-lit sky". The palette is upstream's as is (Omarchy Quattro
# format: named colours, no color0-15, which rice derives as Omarchy does).
mode = "dark"

accent = "#2a7a80"
selection = "#1e1e1e"
muted = "#585553"

background = "#0f0f0f"
dark_background = "#0a0a0a"
darker_background = "#050505"
lighter_background = "#1e1e1e"

foreground = "#e0d8d0"
dark_foreground = "#b7a593"
light_foreground = "#e8e2dc"
bright_foreground = "#f4f2ef"

red = "#e6441a"
yellow = "#e68040"
orange = "#e6622d"
green = "#1a6b6e"
cyan = "#40b8b4"
blue = "#2a7a80"
magenta = "#c4753d"
brown = "#852c15"

bright_red = "#e66b40"
bright_yellow = "#e6a052"
bright_green = "#40c4c0"
bright_cyan = "#70e0dd"
bright_blue = "#52c9cd"
bright_magenta = "#e6b375"

# rice: upstream sets only selection (#1e1e1e, its raised-surface tone), which rice
# and Omarchy also use for selected text, and that's near-invisible on #0f0f0f (1.15:1;
# VS Code lays it on at 60%, Neovim's visual mode is darker than its cursor line).
# selection stays upstream's for rows and hovers; selected text gets the slate teal
# upstream used for it until the Quattro format (ef8ba87), with bright_foreground on it
# (6.4:1).
selection_background = "#4d5a5a"
